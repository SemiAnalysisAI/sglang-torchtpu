# Temporary single-host v7x (2x2x1, TP8) dev pod for GLM-5.3-Flash in project sglang-jax-1126.
# Weights are downloaded from HF zai-org/GLM-5.3-Flash into /cache (PVC qinghan-cache-b).
# Scale to 0 when idle: on-demand TPU node bills while it exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpu-dev-glm-flash-qinghan
  namespace: grok-2-tpuv7
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: tpu-dev-glm-flash-qinghan}
  template:
    metadata:
      labels: {app: tpu-dev-glm-flash-qinghan}
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator-count: "4"
        cloud.google.com/gke-nodepool: tpu7x-2x2x1
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
      - {effect: NoSchedule, key: google.com/tpu, operator: Exists}
      containers:
      - name: main
        image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu-base:base-6bc366f1705c6362
        command: ["/bin/bash", "-c", "sleep infinity"]
        securityContext: {privileged: true}
        env:
        - {name: HF_HOME, value: /cache/hf}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {key: HF_TOKEN, name: hf-secret, optional: true}}
        resources:
          requests: {cpu: "200", memory: 900Gi, ephemeral-storage: 150Gi, google.com/tpu: "4"}
          limits: {cpu: "200", memory: 900Gi, ephemeral-storage: 150Gi, google.com/tpu: "4"}
        volumeMounts:
        - {mountPath: /dev/shm, name: dev-shm}
        - {mountPath: /cache, name: cache}
      volumes:
      - {name: dev-shm, emptyDir: {medium: Memory}}
      - {name: cache, persistentVolumeClaim: {claimName: qinghan-cache-b}}
