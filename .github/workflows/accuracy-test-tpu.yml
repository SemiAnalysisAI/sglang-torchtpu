name: Accuracy Test (TPU)
run-name: Release completed V3.1 evaluation pods for PR803
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  release-completed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: tpu-cluster
          location: us-central1-c
      - name: Verify completion and release only archived evaluation JobSets
        env:
          KUBECTL_REMOTE_COMMAND_WEBSOCKETS: 'false'
        run: python3 .github/tpu-ci/release_completed_v31.py
