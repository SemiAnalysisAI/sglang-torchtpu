name: TPU Base Cache Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read cached base image without suppressing errors
        env:
          CI_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          set -uo pipefail
          tokfile="${RUNNER_TEMP}/tpu-ci.token"
          printf '%s' "$CI_ACCESS_TOKEN" > "$tokfile"
          trap 'rm -f "$tokfile"' EXIT
          image="us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu-base:base-873bb68496b6c24c"
          gcloud artifacts docker images describe "$image" --project sglang-torchtpu --access-token-file="$tokfile"
          echo "describe_rc=$?"
          gcloud artifacts docker tags list us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu-base \
            --filter='tag:base-873bb68496b6c24c' --format=json \
            --project sglang-torchtpu --access-token-file="$tokfile"
          echo "tags_rc=$?"
