# TPU feature-combination e2e -- both layers of test/manual/tpu/feature_combo/,
# via _tpu-test's exec mode:
#   singlehost-combo-test:        engine-level combos 1/2/3 (Qwen3-1.7B, pr-gate host)
#   multihost-combo-test-{pd,spec}: P/D and spec rows across the 2x2x2 slice
# The same layers run nightly (nightly-test-tpu.yml); this action is the isolated
# trigger:
#   gh workflow run combo-test-tpu.yml [-f target=singlehost|multihost|pd|spec] [-f ref=<branch>]
name: Combo Test (TPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      target:
        description: "Which combo layer/row to run"
        required: false
        default: all
        type: choice
        options: [all, singlehost, multihost, pd, spec]

concurrency:
  group: pr364-validation
  cancel-in-progress: false

jobs:
  singlehost-validation:
    name: pr364-remaining-tests
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: 7ed078f0e2b527413f60b5ec04e467cce21903c1
      image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:9d1c789433aefab8eda687309b3a6f9eec1998325ced959f8ab3272eda7473df
      hosts: 1
      exec_cmd: >-
        for f in
        test/registered/tpu/test_pallas_fused_moe.py
        test/registered/tpu/test_fp8_fused_rs_kernel.py
        test/registered/tpu/test_distributed_top_k_sampling.py
        test/registered/tpu/test_ray_bundle_order.py
        test/registered/tpu/test_gdn_attention_v3.py
        test/registered/tpu/test_pallas_rpa_batched_backend.py
        test/registered/tpu/test_batched_rpa_stacked_kernel.py
        test/registered/tpu/test_pallas_rpa_v3_dispatch.py
        test/registered/tpu/test_pallas_moe_op_registration.py
        test/registered/tpu/test_kv_pool_fp8.py
        test/registered/tpu/test_tpu_compile_tracer.py
        test/registered/tpu/test_tpu_basic_inference.py
        test/registered/tpu/test_torch_compile_bundle.py;
        do echo "== $f =="; python3 "$f" || exit $?; done
      run_name: pr364-remaining-tests
    permissions:
      contents: read
      id-token: write
