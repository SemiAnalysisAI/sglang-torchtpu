# TPU feature-combination e2e -- both layers of test/manual/tpu/feature_combo/,
# via _tpu-test's exec mode:
#   singlehost-combo-test:        engine-level combos 1/2/3 (Qwen3-1.7B, pr-gate host)
#   multihost-combo-test-{pd,spec}: P/D and spec rows across the 2x2x2 slice
# The same layers run nightly (nightly-test-tpu.yml); this action is the isolated
# trigger:
#   gh workflow run combo-test-tpu.yml [-f target=singlehost|multihost|pd|spec] [-f ref=<branch>]
name: Combo Test (TPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      target:
        description: "Which combo layer/row to run"
        required: false
        default: all
        type: choice
        options: [all, singlehost, multihost, pd, spec]

concurrency:
  group: pr364-validation
  cancel-in-progress: false

jobs:
  singlehost-validation:
    name: pr364-remaining-tests
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: 6a2f6793199543a4ed70820a6ffa3c13754af8e4
      image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:6b40f6babf3f1437bf538e4d8dc74ff929a90f474bce0aa1a8c69e7b08b94ee5
      hosts: 1
      exec_cmd: >-
        python3 test/run_suite.py --hw tpu --suite stage-a-test-tpu-unit --enable-retry &&
        mv test/registered/tpu/test_prefix_cache.py /tmp/test_prefix_cache.py &&
        python3 test/run_suite.py --hw tpu --suite stage-b-test-tpu-4-v7 --enable-retry
      run_name: pr364-remaining-tests
    permissions:
      contents: read
      id-token: write
