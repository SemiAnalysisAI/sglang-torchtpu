# Reusable: run ONE SLICE's launch groups on the external TPU cluster. The external cluster has
# NO Kueue, so discovery buckets groups per slice (render_external_jobset.py --list-groups) and
# this workflow pins them all to that slice's nodepool and runs them BACK-TO-BACK -- parallel
# across slices (one matrix job each), serial within a slice (cross-group concurrency = 1). For
# each group it renders a JobSet, applies it over the GKE DNS endpoint, streams logs, gates on
# the JobSet Completed/Failed condition, and tears it down before the next group. A trimmed
# cousin of _tpu-test.yml (no admission budget / Workload check). See external/README.md.
name: _external-tpu-test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      image:
        required: true
        type: string            # repo@sha256:... from _tpu-build
      suite:
        required: true
        type: string            # an external-nightly-* suite (all groups in this slice share it)
      slice_name:
        required: true
        type: string            # e.g. external-nightly-2x2x2-s0 (labels + artifact name)
      nodepool_var:
        required: true
        type: string            # NAME of the repo secret holding this slice's nodepool
      nodepool_var_decode:
        required: false
        type: string
        default: ""             # slice-pair rows only: the decode slice's nodepool secret
      groups_json:
        required: true
        type: string            # JSON array of this slice's groups (from --list-groups)
      extra_args:
        required: false
        type: string
        default: ""             # empty -> weights.default_extra_args from external-topology.yaml

permissions:
  contents: read
  id-token: write

concurrency:
  # Serialize per SLICE across ALL runs (keyed on the nodepool, NOT the run id): without Kueue
  # gang-admission, two runs must never apply to the same nodepool at once. Different slices run
  # in parallel. Depth-1 (GitHub keeps one pending) is enough until Kueue lands.
  # A slice-pair row holds two slices, so its key names both.
  group: external-slice-${{ inputs.nodepool_var }}${{ inputs.nodepool_var_decode && format('-{0}', inputs.nodepool_var_decode) || '' }}
  cancel-in-progress: false

env:
  # The runner authenticates as the in-project CI SA; the external cluster grants that SA access
  # to their cluster (RBAC + roles/container.developer) and its DNS endpoint. See README "Access".
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
  # Partner-internal identifiers come from repo secrets (masked in logs, out of source).
  EXTERNAL_CLUSTER: ${{ secrets.EXTERNAL_CLUSTER }}
  EXTERNAL_PROJECT: ${{ secrets.EXTERNAL_PROJECT }}
  EXTERNAL_LOCATION: us-central1        # public GCP region; not a partner identifier
  EXTERNAL_NAMESPACE: default

jobs:
  test:
    # The Actions sidebar shows only this name under the slice row, so name the tests it runs.
    name: ${{ join(fromJSON(inputs.groups_json).*.name, ', ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 380   # > WAIT_SLACK + 2 files x 8100s (= 350 min) + job setup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.EXTERNAL_CLUSTER }}
          location: ${{ env.EXTERNAL_LOCATION }}
          project_id: ${{ env.EXTERNAL_PROJECT }}
          use_dns_based_endpoint: true

      - name: Render + run this slice's groups
        env:
          # Every slice's nodepool secret; the run reads the one named by inputs.nodepool_var
          # (assigned by discovery's round-robin) via indirect expansion. Add a line here when
          # adding a slice to external-topology.yaml's nodepool_vars.
          EXTERNAL_NODEPOOL_2X2X2_0: ${{ secrets.EXTERNAL_NODEPOOL_2X2X2_0 }}
          EXTERNAL_NODEPOOL_2X2X2_1: ${{ secrets.EXTERNAL_NODEPOOL_2X2X2_1 }}
          EXTERNAL_NODEPOOL_2X2X2_2: ${{ secrets.EXTERNAL_NODEPOOL_2X2X2_2 }}
          EXTERNAL_NODEPOOL_2X2X2_3: ${{ secrets.EXTERNAL_NODEPOOL_2X2X2_3 }}
          EXTERNAL_NODEPOOL_2X2X4_0: ${{ secrets.EXTERNAL_NODEPOOL_2X2X4_0 }}
          EXTERNAL_NODEPOOL_2X2X4_1: ${{ secrets.EXTERNAL_NODEPOOL_2X2X4_1 }}
          NODEPOOL_VAR: ${{ inputs.nodepool_var }}
          NODEPOOL_VAR_DECODE: ${{ inputs.nodepool_var_decode }}
          GROUPS_JSON: ${{ inputs.groups_json }}
          IN_SLICE_NAME: ${{ inputs.slice_name }}
          IN_IMAGE: ${{ inputs.image }}
          IN_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -uo pipefail
          slice="$IN_SLICE_NAME"
          ns="$EXTERNAL_NAMESPACE"
          # --- named budgets/limits (one place; the rest of the step only uses these) ---
          POD_RUNNING_DEADLINE=1200   # pods not Running by then -> dump events, keep waiting on the JobSet
          WAIT_FLOOR=9600             # minimum JobSet wait, outlasts the renderer's deadline floor
          WAIT_SLACK=4800             # wait = slack + files x timeout_per_file (mirrors the renderer's formula + margin)
          TOKEN_REFRESH_EVERY=2400    # re-mint the CI SA token well inside its 3600s lifetime
          TOKEN_RETRY_DELAY=45        # retry a failed re-mint quickly, not at the full cadence
          AUTH_FAIL_LIMIT=12          # consecutive unreadable-JobSet polls before declaring access lost
          LIVE_LOG_SYNC_EVERY=600     # cumulative pod-log snapshot to GCS (full copy per sync -> keep coarse)
          LOG_STREAM_MAX=64           # kubectl log streams: pods x (test + sidecars); 10 was too few at 4 pods
          POLL=5                      # JobSet condition poll
          PODS_PRINT_EVERY=12         # print the pod table every POLL x this seconds
          python3 -m pip install --quiet --disable-pip-version-check pyyaml >/dev/null 2>&1 || true
          : > "$RUNNER_TEMP/external-pod-logs.txt"

          # Mirror the accumulating pod log to the CI artifacts bucket every 10 min:
          # GitHub only serves a job's log blob AFTER the job completes, and the
          # pod-logs artifact uploads in the final step -- so without this, a
          # multi-hour benchmark group cannot be triaged (or caught hanging) from
          # outside the runner while it runs. The CI SA holds objectCreator (create,
          # no overwrite), so each sync is a NEW cumulative snapshot; the newest
          # object is the whole log so far. Best-effort (`|| true`). Read with:
          #   gcloud storage cat "$(gcloud storage ls gs://sglang-torchtpu-ci-artifacts/ci-live-logs/<run_id>/<slice>/ | tail -1)"
          LIVE_LOG_DIR="gs://sglang-torchtpu-ci-artifacts/ci-live-logs/${GITHUB_RUN_ID}/${slice}"
          ( while true; do
              sleep "$LIVE_LOG_SYNC_EVERY"
              gcloud storage cp "$RUNNER_TEMP/external-pod-logs.txt" \
                "$LIVE_LOG_DIR/$(date -u +%Y%m%dT%H%M%SZ).log" >/dev/null 2>&1 || true
            done ) &
          LIVE_LOG_SYNC_PID=$!

          # Resolve this slice's nodepool from the secret named by nodepool_var (GitHub masks
          # the value in logs). Fail closed if the secret is unset.
          NODEPOOL="${!NODEPOOL_VAR:-}"
          [ -n "$NODEPOOL" ] || { echo "❌ repo secret ${NODEPOOL_VAR} is not set -- see external/README.md 'Configuration'"; exit 1; }
          NODEPOOL_DECODE=""
          if [ -n "$NODEPOOL_VAR_DECODE" ]; then
            NODEPOOL_DECODE="${!NODEPOOL_VAR_DECODE:-}"
            [ -n "$NODEPOOL_DECODE" ] || { echo "❌ repo secret ${NODEPOOL_VAR_DECODE} is not set"; exit 1; }
          fi

          # Re-mint the CI SA token from a fresh GitHub OIDC token (same exchange the auth action
          # does) and swap it into the kubeconfig; a full slice of groups can outlast one hour.
          refresh_cluster_token() {
            local oidc sts sa_token user
            oidc="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${WIF_PROVIDER}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || return 1
            sts="$(curl -sSf -X POST https://sts.googleapis.com/v1/token \
              -H 'Content-Type: application/json' \
              -d "{\"audience\":\"//iam.googleapis.com/${WIF_PROVIDER}\",
                   \"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",
                   \"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",
                   \"scope\":\"https://www.googleapis.com/auth/cloud-platform\",
                   \"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",
                   \"subjectToken\":\"${oidc}\"}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')" || return 1
            sa_token="$(curl -sSf -X POST \
              "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${CI_SA}:generateAccessToken" \
              -H "Authorization: Bearer ${sts}" -H 'Content-Type: application/json' \
              -d '{"scope":["https://www.googleapis.com/auth/cloud-platform","https://www.googleapis.com/auth/userinfo.email"],"lifetime":"3600s"}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')" || return 1
            user="$(kubectl config view --minify -o jsonpath='{.contexts[0].context.user}')"
            kubectl config set-credentials "$user" --token "$sa_token" >/dev/null
            echo "refreshed cluster credentials at $(date -u +%FT%TZ)"
          }

          # Per-nodepool lease. The concurrency key cannot make a slice-pair row ("<a>-<b>")
          # wait for the single-slice rows ("<a>", "<b>") on the same nodepools, and rows of
          # runs on different refs never share a key, so overlapping runs reached one nodepool
          # and the stale-JobSet sweep below deleted a live run's JobSets. Each nodepool holds
          # a ConfigMap lease in the cluster instead: create is atomic, the holder renews it,
          # and only a lease left unrenewed for LOCK_TTL (a dead runner) can be taken over.
          LOCK_TTL=900                # seconds without renewal before a lease counts as abandoned
          LOCK_RENEW_EVERY=60         # holder renews this often
          LOCK_POLL=30                # waiter retries this often
          HOLDER="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${slice}"
          LOCK_FILE="$RUNNER_TEMP/slice-locks"
          : > "$LOCK_FILE"
          lock_name() { echo "external-tpu-slice-lock-$(printf %s "$1" | sha256sum | cut -c1-16)"; }
          # Returns 0 = held by us, 1 = busy (LOCK_INFO says by whom), 2 = cluster refused.
          try_lock() {
            local cm="$1" err js holder renewed now
            err="$(kubectl -n "$ns" create configmap "$cm" --from-literal=holder="$HOLDER" \
              --from-literal=renewed="$(date +%s)" 2>&1 >/dev/null)" && return 0
            grep -q AlreadyExists <<<"$err" || { LOCK_INFO="$err"; return 2; }
            js="$(kubectl -n "$ns" get configmap "$cm" -o json 2>/dev/null)" || return 1
            holder="$(jq -r '.data.holder' <<<"$js")"; renewed="$(jq -r '.data.renewed // 0' <<<"$js")"
            now=$(date +%s)
            [ "$holder" = "$HOLDER" ] && return 0
            LOCK_INFO="held by ${holder}, renewed $(( now - renewed ))s ago"
            (( now - renewed < LOCK_TTL )) && return 1
            echo "taking over ${cm}: ${LOCK_INFO}"
            # replace carries the resourceVersion, so two runners taking over at once cannot both win.
            jq --arg h "$HOLDER" --arg t "$now" '.data.holder=$h | .data.renewed=$t' <<<"$js" \
              | kubectl -n "$ns" replace -f - >/dev/null 2>&1 || return 1
          }
          renew_locks() {
            local cm js
            while read -r cm; do
              js="$(kubectl -n "$ns" get configmap "$cm" -o json 2>/dev/null)" || continue
              if [ "$(jq -r '.data.holder' <<<"$js")" != "$HOLDER" ]; then
                echo "⚠️ lease ${cm} now held by $(jq -r '.data.holder' <<<"$js")"; continue
              fi
              jq --arg t "$(date +%s)" '.data.renewed=$t' <<<"$js" | kubectl -n "$ns" replace -f - >/dev/null 2>&1 || true
            done < "$LOCK_FILE"
          }
          release_locks() {
            local cm
            while read -r cm; do
              [ "$(kubectl -n "$ns" get configmap "$cm" -o jsonpath='{.data.holder}' 2>/dev/null)" = "$HOLDER" ] \
                && kubectl -n "$ns" delete configmap "$cm" --ignore-not-found >/dev/null 2>&1
            done < "$LOCK_FILE"
            true
          }

          # Delete whatever JobSet is live if the job is canceled mid-slice, then free the slice.
          CUR=""
          LOCK_RENEW_PID=""
          cleanup() {
            [ -n "$CUR" ] && kubectl -n "$ns" delete "$CUR" --ignore-not-found --wait=false 2>/dev/null
            [ -n "$LOCK_RENEW_PID" ] && kill "$LOCK_RENEW_PID" 2>/dev/null
            release_locks
          }
          trap cleanup EXIT
          # A cancel signals the step; exit through the EXIT trap rather than dying first.
          trap 'exit 130' INT TERM

          # Renew from the start: a pair row keeps its first lease alive while it waits on the second.
          ( while sleep "$LOCK_RENEW_EVERY"; do renew_locks; done ) &
          LOCK_RENEW_PID=$!
          # Sorted order, so two rows sharing nodepools cannot each hold one and wait on the other.
          next_refresh=$(( $(date +%s) + TOKEN_REFRESH_EVERY ))
          for pool in $(printf '%s\n' "$NODEPOOL" $NODEPOOL_DECODE | sort -u); do
            cm="$(lock_name "$pool")"; waited=0
            while :; do
              LOCK_INFO=""
              try_lock "$cm"; r=$?
              if [ "$r" = 0 ]; then echo "$cm" >> "$LOCK_FILE"; echo "leased ${cm} after ${waited}s"; break; fi
              if [ "$r" = 2 ]; then echo "⚠️ cannot lease ${cm} (${LOCK_INFO}); running without the slice lock"; break; fi
              (( waited % 300 == 0 )) && echo "waiting for ${cm}: ${LOCK_INFO}"
              if [ "$(date +%s)" -ge "$next_refresh" ]; then
                refresh_cluster_token && next_refresh=$(( $(date +%s) + TOKEN_REFRESH_EVERY )) \
                  || next_refresh=$(( $(date +%s) + TOKEN_RETRY_DELAY ))
              fi
              sleep "$LOCK_POLL"; waited=$(( waited + LOCK_POLL ))
            done
          done

          # With every lease held, a JobSet still pinned to this row's slices belongs to a runner
          # that died without cleaning up. With no gang scheduling, its pods would half-place
          # this run's JobSets, so delete it before starting.
          for pool in "$NODEPOOL" $NODEPOOL_DECODE; do
            stale="$(kubectl -n "$ns" get jobsets -o json 2>/dev/null | jq -r --arg p "$pool" '
              .items[] | select(any(.spec.replicatedJobs[].template.spec.template;
                  .metadata.labels.app == "external-tpu-ci"
                  and .spec.nodeSelector["cloud.google.com/gke-nodepool"] == $p))
              | .metadata.name')"
            for js in $stale; do
              echo "deleting stale JobSet ${js} left on this slice by an earlier run"
              kubectl -n "$ns" delete jobset "$js" --ignore-not-found --wait=true --timeout=300s || true
            done
          done

          # Render, apply, gate, and tear down ONE group's JobSet. Returns 0 pass / 1 fail.
          # $3 = wait budget in seconds (sized from the group's per-file budgets so a
          # long benchmark group is not declared dead while still inside its deadline).
          run_group() {
            local job="$1" label="$2" wait_budget="${3:-9600}" name short sel rc=1
            name="$(kubectl -n "$ns" create -f "$job" -o name)" || { echo "❌ ${label}: create failed"; return 1; }
            CUR="$name"; short="${name##*/}"; sel="jobset.sigs.k8s.io/jobset-name=${short}"
            echo "Created ${name} for ${label}"

            local running_deadline; running_deadline=$(( $(date +%s) + POD_RUNNING_DEADLINE ))
            # Wait for EVERY pod, not just the first: `kubectl logs -f -l` follows only the
            # pods that exist when it attaches, so a role that starts later (a P/D prefill
            # behind its decode) would never be streamed and its verdict would be lost.
            all_started() {
              local phases; phases="$(kubectl -n "$ns" get pods -l "$sel" -o jsonpath='{.items[*].status.phase}' 2>/dev/null)"
              grep -q Running <<<"$phases" && ! grep -q Pending <<<"$phases"
            }
            until all_started; do
              # Fail fast when the JobSet's Jobs are REJECTED (e.g. an admission
              # policy denying the pod spec): no pod will ever run, the JobSet
              # never turns Failed, and waiting the full budget burns hours.
              # "already exists" is EXCLUDED: the JobSet controller races its own
              # reconcile and logs that as JobCreationFailed although the child
              # Job is live and its pods start normally.
              fatal_events="$(kubectl -n "$ns" get events --field-selector reason=JobCreationFailed 2>/dev/null | grep "${short}" | grep -v "already exists" || true)"
              if [ -n "$fatal_events" ]; then
                echo "❌ ${label}: Job creation rejected -- no pod will ever start:"
                echo "$fatal_events" | tail -n 3
                kubectl -n "$ns" delete "$name" --ignore-not-found --wait=false 2>/dev/null || true
                CUR=""
                return 1
              fi
              if [ "$(date +%s)" -ge "$running_deadline" ]; then
                echo "⚠️  ${label}: pods not all Running ${POD_RUNNING_DEADLINE}s after apply; continuing anyway"
                kubectl -n "$ns" get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 30 || true
                break
              fi
              sleep "$POLL"
            done
            kubectl -n "$ns" get pods -l "$sel" -o wide || true

            refresh_cluster_token || echo "credential refresh failed; continuing"
            # Stream logs in the background, re-attaching if the stream dies while
            # the JobSet is still live: the pod log is the ONLY egress for the
            # benchmark results, so a dead stream silently discards them. The cap
            # is 64 because unprivileged pods carry sidecars (gke-gcsfuse), so a
            # 4-host group already needs more streams than kubectl's default
            # concurrency cap of 10 allows.
            ( first=1
              while kubectl -n "$ns" get "$name" >/dev/null 2>&1; do
                jok="$(kubectl -n "$ns" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
                jbad="$(kubectl -n "$ns" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
                { [ "$jok" = "True" ] || [ "$jbad" = "True" ]; } && break
                if [ "$first" = 1 ]; then tailn=-1; first=0; else tailn=20; fi
                kubectl -n "$ns" logs -f -l "$sel" --all-containers=true --prefix=true \
                  --max-log-requests="$LOG_STREAM_MAX" --pod-running-timeout=20m --tail="$tailn" \
                  2>&1 | tee -a "$RUNNER_TEMP/external-pod-logs.txt" || true
                sleep 20
              done ) &
            local stream_pid=$!

            local deadline next_refresh auth_fails=0 iter=0 ok bad get_err
            deadline=$(( $(date +%s) + wait_budget ))  # outlast the JobSet's activeDeadlineSeconds
            next_refresh=$(( $(date +%s) + TOKEN_REFRESH_EVERY ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if [ "$(date +%s)" -ge "$next_refresh" ]; then
                refresh_cluster_token && next_refresh=$(( $(date +%s) + TOKEN_REFRESH_EVERY )) \
                  || { echo "refresh failed; retry in ${TOKEN_RETRY_DELAY}s"; next_refresh=$(( $(date +%s) + TOKEN_RETRY_DELAY )); }
              fi
              if [ $(( iter % PODS_PRINT_EVERY )) -eq 0 ]; then
                echo "--- [$(date +%T)] ${label} pods ---"
                kubectl -n "$ns" get pods -l "$sel" -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,NODE:.spec.nodeName 2>/dev/null || true
              fi
              iter=$(( iter + 1 ))
              if ! get_err="$(kubectl -n "$ns" get "$name" 2>&1 >/dev/null)"; then
                # NotFound is not an access problem: someone deleted the JobSet under us.
                if grep -q NotFound <<<"$get_err"; then echo "❌ ${label}: JobSet ${short} was deleted while running"; break; fi
                auth_fails=$((auth_fails + 1))
                [ "$auth_fails" -eq 3 ] && refresh_cluster_token || true
                if [ "$auth_fails" -ge "$AUTH_FAIL_LIMIT" ]; then echo "❌ ${label}: lost cluster access; outcome unknown"; break; fi
                sleep "$POLL"; continue
              fi
              auth_fails=0
              ok="$(kubectl -n "$ns" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
              bad="$(kubectl -n "$ns" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
              if [ "$ok" = "True" ]; then echo "✅ ${label} PASSED"; rc=0; break; fi
              if [ "$bad" = "True" ]; then
                echo "❌ ${label} FAILED"
                kubectl -n "$ns" get pods -l "$sel" -o wide || true
                kubectl -n "$ns" logs -l "$sel" --all-containers --prefix --tail=200 --max-log-requests=64 2>/dev/null || true
                kubectl -n "$ns" get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 40 || true
                kubectl -n "$ns" describe "$name" | tail -n 120 || true
                rc=1; break
              fi
              sleep "$POLL"
            done
            [ "$rc" = 0 ] || { [ "$iter" -gt 0 ] && echo "❌ ${label}: did not complete before deadline" || true; }
            # Let a still-attached stream drain the final lines (the results JSON
            # is printed at the very end) before tearing the JobSet down.
            sleep 15
            kill "$stream_pid" 2>/dev/null || true
            wait "$stream_pid" 2>/dev/null || true
            kubectl -n "$ns" delete "$name" --ignore-not-found --wait=false 2>/dev/null || true
            # The next group needs every host of the slice free: with no gang
            # scheduling, a pod still terminating here half-places it.
            kubectl -n "$ns" wait --for=delete pod -l "$sel" --timeout=600s >/dev/null 2>&1 \
              || echo "⚠️ ${label}: pods still terminating after 600s"
            CUR=""
            return "$rc"
          }

          n="$(jq length <<<"$GROUPS_JSON")"
          echo "slice ${slice}: ${n} group(s), run serially on one nodepool (cross-group concurrency = 1)"
          overall=0
          for i in $(seq 0 $(( n - 1 ))); do
            g="$(jq -c ".[$i]" <<<"$GROUPS_JSON")"
            files="$(jq -r '.files' <<<"$g")"
            gname="$(jq -r '.name' <<<"$g")"
            gmode="$(jq -r '.mode' <<<"$g")"
            tpf="$(jq -r '.timeout_per_file // 3600' <<<"$g")"
            nf="$(wc -w <<<"$files")"
            echo "::group::group $(( i + 1 ))/${n}: ${gname} (${gmode})"
            python3 .github/tpu-ci/external/render_external_jobset.py \
              --image "$IN_IMAGE" \
              --group "$g" \
              --nodepool "$NODEPOOL" \
              --nodepool-decode "$NODEPOOL_DECODE" \
              --extra-args "$IN_EXTRA_ARGS" > /tmp/external-job.yaml || { echo "render failed for ${gname}"; overall=1; echo '::endgroup::'; continue; }
            grep -nE 'generateName:|completions:|gke-nodepool:|gke-tpu-topology:|bucketName:|MODE|SINGLE_HOST|bash "benchmark' /tmp/external-job.yaml | head -20
            # Waiting outlasts the rendered activeDeadlineSeconds (same formula + slack).
            wait_budget=$(( WAIT_SLACK + nf * tpf )); (( wait_budget < WAIT_FLOOR )) && wait_budget=$WAIT_FLOOR
            run_group /tmp/external-job.yaml "$gname" "$wait_budget" || overall=1
            echo '::endgroup::'
          done
          echo "slice ${slice} done, overall rc=${overall}"
          kill "$LIVE_LOG_SYNC_PID" 2>/dev/null || true
          gcloud storage cp "$RUNNER_TEMP/external-pod-logs.txt" \
            "$LIVE_LOG_DIR/$(date -u +%Y%m%dT%H%M%SZ)-final.log" >/dev/null 2>&1 || true
          exit "$overall"

      - name: Upload pod logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: external-tpu-logs-${{ inputs.slice_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/external-pod-logs.txt
          if-no-files-found: ignore
          retention-days: 30
