name: Kimi dev pods 20260923

on:
  push:
    branches: [ops/kimi-dev-20260923]
    paths:
      - .github/workflows/kimi-dev-20260923.yml
      - .github/tpu-ci/kimi_dev_20260923.py
      - .github/tpu-ci/kimi_dev_driver.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: kimi-dev-20260923
  cancel-in-progress: false

jobs:
  inspect-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: tpu-cluster
          location: us-central1-c
      - run: python3 -m pip install pyyaml
      - run: python3 .github/tpu-ci/kimi_dev_20260923.py
