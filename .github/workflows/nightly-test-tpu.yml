# Nightly TPU e2e. Builds the image ONCE, then:
#   * single-host  -> run three LPT-balanced shards sequentially.
#   * multi-host    -> discover_tpu.py finds multi-host test files (TPU_LAUNCH)
#                      registered to nightly-tpu-multihost and GROUPS them by launch spec;
#                      one JobSet per group (launch once, rank-0 runs the group's files).
# Same-setup files share a server. Every job runs in the `nightly` lane (topology.yaml), so
# it uses the nightly pools rather than competing with the PR gate, and Kueue queues the
# groups against that lane's slice quota instead of a GitHub-side mutex.
name: Nightly Test (TPU)

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily (low-PR hour); adjust as needed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      # Scheduled runs (inputs empty) run everything.
      only:
        description: "Run only one part (combo = both combo layers)"
        required: false
        default: all
        type: choice
        options:
          - all
          - accuracy
          - combo
          - combo-mh
          - combo-sh
          - mh
          - pd-mh-gpt-120b
          - pd-mh-gpt-120b-pc-offload
          - pd-mh-gpt-120b-tp-reshard
          - pd-sh-gpt-120b
          - pd-sh-gpt-120b-spec
          - perf
          - sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  single-host:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'sh' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        partition: [0, 1, 2]
    name: sh-${{ matrix.partition }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      suite: nightly-tpu-singlehost
      nightly: true
      partition_id: ${{ matrix.partition }}
      partition_size: 3
      run_name: nightly-tpu-singlehost-${{ matrix.partition }}
      # The spec-decoding gsm8k gates serve gpt-oss-120b / qwen3-coder-480b from
      # the ROX weights disk at /weights; harmless for tests that don't use it.
      weights_pvc: model-weights-rox
    permissions:
      contents: read
      id-token: write

  # Discover P/D tests from register_tpu_ci(suite="nightly-tpu-pd", nightly=True).
  # TPU_LAUNCH beside each registration supplies topology that suite mode cannot express.
  discover-pd:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || startsWith(inputs.only, 'pd-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.d.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        run: |
          set -euo pipefail
          tests="$(python3 .github/tpu-ci/discover_tpu.py --mode pd --suite nightly-tpu-pd --only '${{ inputs.only || 'all' }}')"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "discovered P/D tests: $tests"

  # One P/D JobSet per registered test. Each engine role occupies its own slice.
  pd-integration:
    needs: [build, discover-pd]
    if: needs.discover-pd.outputs.tests != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test: ${{ fromJSON(needs.discover-pd.outputs.tests) }}
    name: ${{ matrix.test.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      nightly: true
      hosts: ${{ matrix.test.hosts }}
      pd_prefill_hosts: ${{ matrix.test.prefill_hosts }}
      pd_decode_hosts: ${{ matrix.test.decode_hosts }}
      exec_cmd: ${{ matrix.test.exec_cmd }}
      files: ${{ matrix.test.files }}
      weights_pvc: ${{ matrix.test.weights_pvc }}
      run_name: ${{ matrix.test.name }}
    permissions:
      contents: read
      id-token: write

  # Feature-combination layers: same exec-mode runs as the standalone
  # combo-test-tpu.yml action; these jobs add nightly cadence.
  singlehost-combo:
    needs: build
    if: ${{ contains(fromJSON('["all","combo","combo-sh"]'), inputs.only || 'all') }}
    name: combo-sh
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      exec_cmd: python3 test/manual/tpu/feature_combo/test_feature_combos_singlehost.py all
      run_name: combo-sh
    permissions:
      contents: read
      id-token: write

  combo-multihost-spec:
    # Unchained: Kueue queues the hosts=2 jobs, so this need not wait out multi-host.
    # spec: gated Llama-3.1-8B from HF (HF_TOKEN needs Meta license access). The pd
    # row was dropped -- it duplicated pd-mh-gpt-120b-pc-offload.
    needs: build
    if: ${{ contains(fromJSON('["all","combo","combo-mh"]'), inputs.only || 'all') }}
    name: combo-mh-spec
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      exec_cmd: python3 test/manual/tpu/feature_combo/multihost/test_feature_combos.py spec
      weights_pvc: model-weights-rox
      run_name: combo-mh-spec
    permissions:
      contents: read
      id-token: write

  # Throughput sweeps, one job per model so they take separate slices and run in
  # parallel -- same exec-mode shape as the combo layers above. Also dispatchable
  # on its own (perf-test-tpu.yml) to collect a datapoint without a full nightly.
  perf:
    needs: build
    if: ${{ contains(fromJSON('["all","perf"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        # qwen3-30b was retired: its 480B sibling's perf source is the agentic
        # sweep in the multi-host job, which dumps its own workload metrics.
        include:
          - suite: nightly-tpu-perf-gpt-oss-120b
            name: perf-sh-gpt-120b
    name: ${{ matrix.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      weights_pvc: model-weights-rox
      timeout_per_file: 1800
    permissions:
      contents: read
      id-token: write

  # Accuracy gates, one job per model -- the same fan-out as perf, so a broken
  # model costs the others nothing. Also dispatchable on its own
  # (accuracy-test-tpu.yml) to collect a datapoint without a full nightly.
  accuracy:
    needs: build
    if: ${{ contains(fromJSON('["all","accuracy"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: nightly-tpu-accuracy-gpt-oss-120b
            name: accuracy-sh-gpt-120b
    name: ${{ matrix.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      # gpt-oss-120b serves from the shared ROX disk at /weights.
      weights_pvc: model-weights-rox
      # est_time 2400 (GPQA at 8 repeats + MMLU at 2000 examples) plus bring-up.
      timeout_per_file: 3600
    permissions:
      contents: read
      id-token: write

  # Discover multi-host launch groups from the test files (test-owned launch specs).
  discover:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'mh' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        run: |
          set -euo pipefail
          groups="$(python3 .github/tpu-ci/discover_tpu.py --mode multihost --suite nightly-tpu-multihost)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  # One JobSet per launch group. matrix.group is a discovered object.
  multi-host:
    needs: [build, discover]
    if: needs.discover.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      run_name: ${{ matrix.group.name }}
    permissions:
      contents: read
      id-token: write
