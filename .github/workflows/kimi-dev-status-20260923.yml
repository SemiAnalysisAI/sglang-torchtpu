name: Kimi dev status 20260923

on:
  push:
    branches: [ops/kimi-dev-20260923]
    paths:
      - .github/workflows/kimi-dev-status-20260923.yml

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: tpu-cluster
          location: us-central1-c
      - name: Read dev evaluation status
        run: |
          set -euo pipefail
          kubectl -n tpu-ci get jobset kimi-dev-mmmu-20260923-r1 -o json
          kubectl -n tpu-ci get pods -l jobset.sigs.k8s.io/jobset-name=kimi-dev-mmmu-20260923-r1 -o wide
          for p in $(kubectl -n tpu-ci get pods -l jobset.sigs.k8s.io/jobset-name=kimi-dev-mmmu-20260923-r1 -o name); do
            kubectl -n tpu-ci logs "$p" --tail=12 || true
          done
          gcloud storage ls 'gs://sglang-torchtpu-gcs-shared/evals/kimi-dev-mmmu-20260923-r1/rank0/*/server.log.tail.gz' > /tmp/objects.txt || true
          if test -s /tmp/objects.txt; then
            latest=$(sort /tmp/objects.txt | tail -n 1)
            gcloud storage cat "$latest" | gzip -dc | tail -n 45
          fi
