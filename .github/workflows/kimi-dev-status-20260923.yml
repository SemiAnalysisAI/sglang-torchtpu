name: Kimi dev status 20260923

on:
  push:
    branches: [ops/kimi-dev-20260923]
    paths:
      - .github/workflows/kimi-dev-status-20260923.yml

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: tpu-cluster
          location: us-central1-c
      - name: Read dev evaluation status
        run: |
          set -euo pipefail
          kubectl -n tpu-ci get jobset kimi-dev-mmmu-20260923-r1 -o json
          kubectl -n tpu-ci get events --field-selector involvedObject.name=kimi-dev-mmmu-20260923-r1
          kubectl -n tpu-ci get events --field-selector involvedObject.name=kimi-dev-mmmu-20260923-r1-slice-0
          kubectl -n tpu-ci get jobs -l jobset.sigs.k8s.io/jobset-name=kimi-dev-mmmu-20260923-r1 -o json
          kubectl -n tpu-ci get pods -l jobset.sigs.k8s.io/jobset-name=kimi-dev-mmmu-20260923-r1 -o wide
          for p in $(kubectl -n tpu-ci get pods -l jobset.sigs.k8s.io/jobset-name=kimi-dev-mmmu-20260923-r1 -o name); do
            kubectl -n tpu-ci logs "$p" --tail=12 || true
          done
          gcloud storage ls 'gs://sglang-torchtpu-gcs-shared/evals/kimi-dev-mmmu-20260923-r1/rank0/*/server.log.tail.gz' > /tmp/objects.txt || true
          if test -s /tmp/objects.txt; then
            latest=$(sort /tmp/objects.txt | tail -n 1)
            gcloud storage cat "$latest" | gzip -dc > /tmp/kimi-server-tail.log
            python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('/tmp/kimi-server-tail.log').read_text(errors='replace').splitlines()
          pattern = re.compile(r'compil|batch.?size|bs=|Loading|loaded|weight|Capture|captur|precompil|Ready|running|Decode batch|VMEM|Vmem|Traceback|Error|Exception', re.I)
          matches = [line for line in lines if pattern.search(line) and len(line) < 2000]
          for line in matches[-100:]:
              print(line)
          print('\n'.join(lines[-20:]))
          PY
          fi
          for artifact in status.json eval.log.tail.gz results.tar.gz; do
            gcloud storage ls "gs://sglang-torchtpu-gcs-shared/evals/kimi-dev-mmmu-20260923-r1/rank0/*/$artifact" > /tmp/objects.txt || true
            if test -s /tmp/objects.txt; then
              latest=$(sort /tmp/objects.txt | tail -n 1)
              gcloud storage cat "$latest" > "/tmp/kimi-dev-$artifact"
            fi
          done
          if test -f /tmp/kimi-dev-status.json; then
            cat /tmp/kimi-dev-status.json
          fi
          if test -f /tmp/kimi-dev-eval.log.tail.gz; then
            gzip -dc /tmp/kimi-dev-eval.log.tail.gz | tail -n 25
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimi-server-tail
          path: |
            /tmp/kimi-server-tail.log
            /tmp/kimi-dev-*
